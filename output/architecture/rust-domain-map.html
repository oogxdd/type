  <script>
    (() => {
      const root = document.getElementById('type-domain-map');
      const data = JSON.parse(root.querySelector('#type-domain-data').textContent);
      const choices = root.querySelector('#type-domain-choices');
      const detail = root.querySelector('#type-domain-detail');
      const escape = value => String(value).replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
      const signature = (label, fn) => fn ? `<div class="signature"><div class="text-small">${label}</div><code>${escape(fn.signature)}</code><div class="text-small">${escape(fn.path)}:${fn.line}</div></div>` : '';
      function render(index) {
        const item = data[index];
        [...choices.children].forEach((button, i) => button.setAttribute('aria-pressed', String(i === index)));
        const desktop = new Map(item.desktop.map(fn => [fn.name, fn]));
        const mobile = new Map(item.mobile.map(fn => [fn.name, fn]));
        const common = item.desktop.filter(fn => mobile.has(fn.name)).map(fn => fn.name);
        const desktopOnly = item.desktop.filter(fn => !mobile.has(fn.name)).map(fn => fn.name);
        const mobileOnly = item.mobile.filter(fn => !desktop.has(fn.name)).map(fn => fn.name);
        const group = (label, names) => names.length ? `<h3>${label} · ${names.length}</h3>${names.map(name => `<details><summary><code>${escape(name)}</code></summary>${signature('Desktop · Tauri', desktop.get(name))}${signature('Mobile · UniFFI', mobile.get(name))}</details>`).join('')}` : '';
        detail.innerHTML = `<h2>${escape(item.name)} — ${escape(item.title)}</h2>
          <div class="text-small">${escape(item.kind)}</div>
          <div class="domain-detail">${escape(item.purpose)}</div>
          <div class="flow" aria-label="Связанные части системы">${item.flow.map((part,i) => `${i ? '<span aria-hidden="true">→</span>' : ''}<span><code>${escape(part)}</code></span>`).join('')}</div>
          <div class="domain-detail">${escape(item.note)}</div>
          ${group('Обе платформы',common)}${group('Только desktop',desktopOnly)}${group('Только mobile / FFI',mobileOnly)}
          ${!item.desktop.length && !item.mobile.length ? '<div>Прямых команд Tauri или функций UniFFI нет.</div>' : ''}
          ${item.core.length ? `<details><summary>Внутренний Rust API · ${item.core.length} методов / функций</summary>${item.core.map(fn => signature(item.coreLabel,fn)).join('')}</details>` : ''}
          <hr><div class="text-small">${escape(item.source)}</div>`;
      }
      data.forEach((item,index) => {
        const button = document.createElement('button');
        button.type = 'button'; button.className = 'btn'; button.textContent = item.name;
        button.setAttribute('aria-pressed', String(index === 0));
        button.addEventListener('click', () => render(index)); choices.append(button);
      });
      render(0);
    })();
  </script>
