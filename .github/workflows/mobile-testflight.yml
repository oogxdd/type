name: Mobile TestFlight

on:
  push:
    tags:
      - "mobile-v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 0.2.0"
        required: true
        type: string
      build_number:
        description: "Optional iOS build number. Defaults to the GitHub run number."
        required: false
        type: string

concurrency:
  group: mobile-testflight-${{ github.ref }}
  cancel-in-progress: false

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.parse.outputs.version }}
      tag: ${{ steps.parse.outputs.tag }}
      build_number: ${{ steps.parse.outputs.build_number }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: parse
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
            TAG="mobile-v$VERSION"
            BUILD_NUMBER="${{ inputs.build_number }}"
            [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
              echo "Expected a semver version like 0.2.0, got $VERSION." >&2
              exit 1
            }
            if [ "${{ github.ref_name }}" != "main" ]; then
              echo "Manual mobile releases must be run from main." >&2
              exit 1
            fi
          else
            TAG="${{ github.ref_name }}"          # e.g. mobile-v0.2.0
            VERSION="${TAG#mobile-v}"             # strip release prefix
            BUILD_NUMBER=""
            [[ "$TAG" =~ ^mobile-v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
              echo "Expected a mobile semver tag like mobile-v0.2.0, got $TAG." >&2
              exit 1
            }
            git fetch origin main
            RELEASE_SHA="$(git rev-list -n 1 "$TAG")"
            git merge-base --is-ancestor "$RELEASE_SHA" origin/main || {
              echo "Tag $TAG does not point to a commit on origin/main." >&2
              exit 1
            }
          fi

          if [ -z "$BUILD_NUMBER" ]; then
            BUILD_NUMBER="${{ github.run_number }}"
          fi
          [[ "$BUILD_NUMBER" =~ ^[0-9]+$ ]] || {
            echo "Expected a numeric iOS build number, got $BUILD_NUMBER." >&2
            exit 1
          }

          {
            echo "version=$VERSION"
            echo "tag=$TAG"
            echo "build_number=$BUILD_NUMBER"
          } >> "$GITHUB_OUTPUT"
          echo "Mobile release -> version=$VERSION build=$BUILD_NUMBER tag=$TAG"

  github-release:
    if: github.event_name == 'push'
    needs: setup
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish GitHub release metadata
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.setup.outputs.tag }}
          VERSION: ${{ needs.setup.outputs.version }}
        run: |
          gh release create "$TAG" \
            --repo "${{ github.repository }}" \
            --verify-tag \
            --title "Type Mobile $VERSION" \
            --notes "Mobile release $VERSION. TestFlight delivery is handled by the Mobile TestFlight workflow." \
            --latest=false

  ios:
    needs: setup
    runs-on: macos-26
    timeout-minutes: 180
    environment: testflight
    permissions:
      contents: read
    env:
      APP_VARIANT: production
      MOBILE_VERSION: ${{ needs.setup.outputs.version }}
      IOS_BUILD_NUMBER: ${{ needs.setup.outputs.build_number }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select Xcode 26.6
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer
          xcodebuild -version

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios
      - uses: swatinem/rust-cache@v2

      - name: Verify required secrets
        run: |
          set -euo pipefail
          for name in \
            APPLE_TEAM_ID \
            APP_STORE_CONNECT_KEY_ID \
            APP_STORE_CONNECT_ISSUER_ID \
            APP_STORE_CONNECT_PRIVATE_KEY
          do
            [ -n "${!name:-}" ] || {
              echo "Missing required secret: $name" >&2
              exit 1
            }
          done

      - name: Install dependencies
        run: npm ci

      - name: Check mobile code
        run: |
          npm run typecheck -w @typenotes/mobile
          npm run test -w @typenotes/mobile

      - name: Generate iOS native core
        run: npm run --workspace @typenotes/mobile-core codegen:ios:device

      - name: Sync Expo native project
        working-directory: apps/mobile
        run: npx expo prebuild --platform ios

      - name: Install iOS pods
        working-directory: apps/mobile
        run: npx pod-install ios

      - name: Install App Store Connect API key
        run: |
          set -euo pipefail

          ASC_KEY_DIR="$HOME/.appstoreconnect/private_keys"
          ASC_KEY_PATH="$ASC_KEY_DIR/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"

          mkdir -p "$ASC_KEY_DIR"
          printf '%s' "$APP_STORE_CONNECT_PRIVATE_KEY" > "$ASC_KEY_PATH"
          chmod 600 "$ASC_KEY_PATH"

          echo "ASC_KEY_PATH=$ASC_KEY_PATH" >> "$GITHUB_ENV"

      - name: Archive iOS app
        working-directory: apps/mobile/ios
        run: |
          set -euo pipefail
          xcodebuild \
            -workspace Type.xcworkspace \
            -scheme Type \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/Type.xcarchive" \
            archive \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            CODE_SIGNING_ALLOWED=NO \
            MARKETING_VERSION="$MOBILE_VERSION" \
            CURRENT_PROJECT_VERSION="$IOS_BUILD_NUMBER"

      - name: Export IPA
        working-directory: apps/mobile/ios
        run: |
          set -euo pipefail
          xcodebuild \
            -exportArchive \
            -archivePath "$RUNNER_TEMP/Type.xcarchive" \
            -exportOptionsPlist ../ExportOptions.plist \
            -exportPath "$RUNNER_TEMP/type-export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$APP_STORE_CONNECT_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID"
          test -f "$RUNNER_TEMP/type-export/Type.ipa"

      - name: Validate IPA with App Store Connect
        run: |
          xcrun altool --validate-app \
            --type ios \
            --file "$RUNNER_TEMP/type-export/Type.ipa" \
            --apiKey "$APP_STORE_CONNECT_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"

      - name: Upload to TestFlight
        run: |
          xcrun altool --upload-app \
            --type ios \
            --file "$RUNNER_TEMP/type-export/Type.ipa" \
            --apiKey "$APP_STORE_CONNECT_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"

      - name: Upload IPA artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: type-ios-${{ needs.setup.outputs.tag }}
          path: ${{ runner.temp }}/type-export/Type.ipa
          if-no-files-found: ignore

      - name: Remove App Store Connect API key
        if: always()
        run: |
          if [ -n "${ASC_KEY_PATH:-}" ]; then
            rm -f "$ASC_KEY_PATH"
          fi
