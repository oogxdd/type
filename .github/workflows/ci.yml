name: CI

# Fast feedback on every PR and on pushes to the default branch: typecheck +
# unit tests for every npm workspace (desktop app, shared packages, mobile app)
# and the Rust cargo workspace (core crates + Tauri backend). Release/build
# workflows live in release.yml.
#
# paths-ignore skips documentation-only changes. It is deliberately declarative
# rather than a `[skip ci]` convention: nothing to remember per commit, and it
# fails in the safe direction — a path not on this list runs CI, and a push or
# PR that touches *any* other file runs CI even if it also edits docs (the
# filter only skips when every changed path matches).
#
# The two lists are duplicated because GitHub Actions does not support YAML
# anchors — keep them in sync by hand.
on:
  push:
    branches: [main, master]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE.md"
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE.md"
  # Lets you re-run checks without an empty commit — including for a commit that
  # a skip marker suppressed.
  workflow_dispatch:

jobs:
  typescript:
    name: TypeScript (typecheck + tests, all workspaces)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Typecheck
        run: npm run typecheck --workspaces --if-present
      - name: Unit tests
        run: npm test --workspaces --if-present

  rust:
    name: Rust (cargo test, workspace)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
      # Tauri's Linux build needs these system libraries to compile the lib
      # (and therefore its test harness).
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf
      - name: Rust unit tests
        run: cargo test --workspace --lib
