name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Resolve Pages URLs
        run: |
          OWNER="${{ github.repository_owner }}"
          REPO="${{ github.event.repository.name }}"

          if [ "$REPO" = "$OWNER.github.io" ]; then
            BASE_PATH="/"
            REPO_PREFIX=""
          else
            BASE_PATH="/$REPO/"
            REPO_PREFIX="/$REPO"
          fi

          SITE_URL="https://$OWNER.github.io$REPO_PREFIX"
          OTA_MANIFEST_URL="$SITE_URL/ota/manifest.json"
          OTA_CDN_BASE_URL="$SITE_URL/ota"

          echo "BASE_PATH=$BASE_PATH" >> "$GITHUB_ENV"
          echo "VITE_OTA_MANIFEST_URL=$OTA_MANIFEST_URL" >> "$GITHUB_ENV"
          echo "OTA_CDN_BASE_URL=$OTA_CDN_BASE_URL" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm install

      - name: Build web + OTA artifacts
        run: |
          npx tsc
          npx vite build --base "$BASE_PATH"
          npx vite build --config vite.ota.config.ts --base "$BASE_PATH"
          npm run ota:prepare
          touch dist/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
