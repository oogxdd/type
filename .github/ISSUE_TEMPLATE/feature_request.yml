name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes:
      label: What need should this address?
      description: Describe the user problem or workflow.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed approach
      description: Describe the change and any trade-offs.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
