<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Type — разговор</title>
  <style>
    :root { color-scheme: dark; font: 16px/1.5 system-ui, sans-serif; background:#101117; color:#eeeff4; }
    * { box-sizing:border-box; }
    body { max-width:820px; padding:28px 18px 70px; margin:auto; }
    h1 { font-size:2rem; margin:.2em 0; }
    p { color:#aab0c0; }
    button, textarea { font:inherit; }
    select { font:inherit; background:#31394b; color:#f2f3fa; border:1px solid #505a70; border-radius:8px; padding:7px; }
    button { background:#8598ff; color:#0d132e; border:0; border-radius:12px; padding:10px 16px; cursor:pointer; font-weight:600; }
    button:disabled { opacity:.45; cursor:default; }
    button.secondary { background:#31394b; color:#f2f3fa; }
    .controls { display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin:22px 0; }
    .status { min-height:2em; color:#aebfff; }
    .messages { border:1px solid #343b50; border-radius:16px; min-height:220px; max-height:55vh; overflow:auto; padding:18px; background:#181c28; }
    .message { margin:0 0 16px; white-space:pre-wrap; overflow-wrap:anywhere; }
    .message strong { color:#aebfff; display:block; font-size:.84rem; margin-bottom:4px; }
    form { margin-top:18px; }
    textarea { display:block; width:100%; min-height:90px; resize:vertical; padding:12px; border-radius:12px; border:1px solid #505a70; background:#181c28; color:#fff; }
    form button { margin-top:10px; }
    label { display:inline-flex; gap:7px; align-items:center; color:#cdd1df; }
    small { color:#9299aa; }
    audio { display:none; }
  </style>
</head>
<body>
  <h1>Разговор с Type</h1>
  <p>Голос ведёт GPT-Live. Контекст и память доступны агенту через Notes MCP.</p>
  <div class="controls">
    <button id="start" type="button">Начать голосовой разговор</button>
    <button id="stop" type="button" class="secondary" disabled>Завершить</button>
    <label>Режим <select id="mode"><option value="conversation">Разговор</option><option value="review">Обзор</option><option value="observation">Наблюдение</option><option value="morning_note">Утреннее сообщение</option></select></label>
    <label>Summary <select id="summary"><option value="short">Short</option><option value="medium">Medium</option><option value="large">Large</option></select></label>
    <label><input id="save" type="checkbox" checked>Разрешить обновлять память</label>
  </div>
  <div id="status" class="status" role="status">Готово к разговору</div>
  <div id="messages" class="messages" aria-live="polite"></div>
  <form id="text-form">
    <label for="typed">Или написать</label>
    <textarea id="typed" placeholder="Спроси о своих заметках, попроси обзор или обсуди мысль..."></textarea>
    <button id="send" type="submit">Отправить</button>
  </form>
  <small>История этой беседы держится в открытой странице. Полезные выводы агент может сохранить в me, reviews или agent.</small>
  <audio id="audio" autoplay controls></audio>
  <script type="module" src="/voice-client.js"></script>
</body>
</html>
