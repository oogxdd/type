<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1, minimum-scale=1, user-scalable=no"
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#14171b" data-app-theme-color="true" />
    <title>Type</title>
    <script>
      (() => {
        const storedTheme = window.localStorage.getItem("notes-viewer-theme");
        const launchTheme =
          storedTheme === "light" || storedTheme === "dark" ? storedTheme : "dark";
        document.documentElement.setAttribute("data-launch-theme", launchTheme);
        document.documentElement.classList.toggle("dark", launchTheme === "dark");
        document.documentElement.style.colorScheme = launchTheme;
        const themeColor = launchTheme === "dark" ? "#14171b" : "#f5f6fb";
        const themeColorMeta = document.querySelector(
          'meta[name="theme-color"][data-app-theme-color="true"]'
        );
        if (themeColorMeta) {
          themeColorMeta.setAttribute("content", themeColor);
        }
      })();
    </script>
    <style>
      html,
      body,
      #root {
        margin: 0;
        height: 100%;
      }

      body {
        background: #14171b;
      }

      html[data-launch-theme="light"] body {
        background: #f5f6fb;
      }

      #ota-splash {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #14171b;
        opacity: 1;
        transition: opacity 140ms ease-out, visibility 140ms ease-out;
        z-index: 9999;
      }

      html[data-launch-theme="light"] #ota-splash {
        background: #f5f6fb;
      }

      #ota-splash.launch-splash-hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      #ota-logo {
        width: 120px;
        height: 120px;
        object-fit: contain;
      }

      #ota-status {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
    </style>
  </head>

  <body>
    <div id="ota-splash">
      <img id="ota-logo" src="/type-splash-logo.png" alt="Type logo" />
      <div id="ota-status">Loading...</div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/ota-bootstrap.ts"></script>
  </body>
</html>
