<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1, minimum-scale=1, user-scalable=no"
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#1c1c22" data-app-theme-color="true" />
    <title>Type</title>
    <script>
      (() => {
        const storedTheme = window.localStorage.getItem("notes-viewer-theme");
        const launchTheme =
          storedTheme === "light" || storedTheme === "dark" ? storedTheme : "dark";
        document.documentElement.setAttribute("data-launch-theme", launchTheme);
        document.documentElement.classList.toggle("dark", launchTheme === "dark");
        document.documentElement.style.colorScheme = launchTheme;
        const themeColor = launchTheme === "dark" ? "#1c1c22" : "#f2f2f5";
        const themeColorMeta = document.querySelector(
          'meta[name="theme-color"][data-app-theme-color="true"]'
        );
        if (themeColorMeta) {
          themeColorMeta.setAttribute("content", themeColor);
        }

        // Guess whether the native window got a translucent material so the
        // very first paint is already glass on macOS instead of flashing an
        // opaque floor. The Tauri shell overwrites this attribute with the
        // truth as soon as it has tried to apply one (see lib.rs).
        const looksLikeMac = /Mac/i.test(window.navigator.userAgent);
        document.documentElement.setAttribute(
          "data-window-material",
          looksLikeMac ? "blur" : "none"
        );
      })();
    </script>
    <style>
      html,
      body,
      #root {
        margin: 0;
        height: 100%;
      }

      body {
        background: #1c1c22;
      }

      html[data-launch-theme="light"] body {
        background: #f2f2f5;
      }

      /* With a translucent window material the app has no opaque floor — the
         splash must not paint one either, or launching flashes a solid slab
         before the glass appears. */
      html[data-window-material="blur"] body {
        background: rgba(24, 24, 32, 0.4);
      }

      html[data-window-material="blur"][data-launch-theme="light"] body {
        background: rgba(255, 255, 255, 0.28);
      }

      #launch-splash {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #1c1c22;
        opacity: 1;
        transition: opacity 140ms ease-out, visibility 140ms ease-out;
        z-index: 9999;
      }

      html[data-launch-theme="light"] #launch-splash {
        background: #f2f2f5;
      }

      html[data-window-material="blur"] #launch-splash {
        background: transparent;
      }

      #launch-splash.launch-splash-hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      #launch-logo {
        width: min(36vw, 260px);
        height: min(36vw, 260px);
        object-fit: contain;
      }

      #launch-status {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
    </style>
  </head>

  <body>
    <div id="launch-splash">
      <img id="launch-logo" src="/type-splash-logo.png" alt="Type logo" />
      <div id="launch-status">Loading...</div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
