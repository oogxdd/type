[package]
name = "type-core"
version = "0.1.0"
description = "Framework-free core for the Type notes app: notes/front-matter, profiles (working folders), security, recordings + transcription queue, handwriting OCR, Apple Notes import, git sync, and local-network sync. Consumed by the Tauri shell and the React Native FFI crate."
edition.workspace = true
rust-version.workspace = true

[lib]
name = "type_core"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
git2 = { version = "0.20", features = ["vendored-openssl"] }
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
uuid = { version = "1", features = ["v7"] }
time = { version = "0.3", features = ["formatting", "macros", "parsing"] }
argon2 = "0.5"
chacha20poly1305 = { version = "0.10", features = ["std"] }
zeroize = "1.8"
zip = { version = "0.6", default-features = false, features = ["deflate"] }
mdns-sd = "0.20.0"
ssh-key = { version = "0.6", features = ["ed25519"] }
rand_core = { version = "0.6", features = ["std"] }
iroh = { version = "1.0.3", default-features = false }
iroh-tickets = "1.0.0"
# iroh-blobs follows its own release train. 0.103 is the current line that
# interoperates with iroh 1.x; see docs/IROH_SYNC_EXPERIMENT.md for its
# pre-production stability boundary.
iroh-blobs = "0.103.0"
anyhow = "1"
tokio = { version = "1.52.3", features = ["rt-multi-thread", "io-util", "net", "time", "macros", "sync"] }
sha2 = "0.10"

[target.'cfg(not(any(target_os = "ios", target_os = "android")))'.dependencies]
russh = { version = "0.62.2", default-features = false, features = ["ring", "flate2"] }
tokio = { version = "1.52.3", features = ["process"] }
