[package]
name = "type-tui"
version = "0.1.0"
description = "Terminal shell for the Type notes app: folder tree, note list, vim-like editor, and git sync over the same type-core services the desktop and mobile apps use."
edition = "2021"

[[bin]]
name = "type-tui"
path = "src/main.rs"

[dependencies]
# The shared core. `default-features = false` skips local-sync (russh + tokio +
# mDNS), recordings and handwriting (reqwest), the Apple Notes importer, and the
# profile backup zip. We keep `git-sync` because `:sync` needs libgit2.
type-core = { path = "../type-core", default-features = false, features = ["git-sync"] }

ratatui = { version = "0.30", features = ["unstable-rendered-line-info"] }

# NOTE: the widely-known `tui-textarea` (rhysd) has no soft wrap — its word-wrap
# issue has been open since 2022 and the crate's last release was Oct 2024.
# `tui-textarea-2` is the maintained fork; `WrapMode` is the reason we use it,
# since notes are markdown paragraphs stored as single long lines.
# "search" adds the regex-backed `/pattern` search we bind to vim's `/`, `n`, `N`.
tui-textarea-2 = { version = "0.12", features = ["search"] }

# Render the same Markdown source as a styled, read-only document. Syntax
# highlighting is deliberately off: keeping the reader light matters more than
# embedding a full TextMate theme engine in the terminal shell.
tui-markdown = { version = "0.3.9", default-features = false }

# Resolve the platform app-data directory (what `AppEnv` needs), so the TUI
# reads the same notes root the desktop app writes.
dirs = "5"

# Date math for the Feed's time buckets (Today / Yesterday / ISO weeks / months).
# `clock` gives `Local::now()`, matching the desktop's local-time bucketing.
chrono = { version = "0.4", default-features = false, features = ["clock"] }

# Async runtime for non-blocking git sync. `rt-multi-thread` gives us a worker
# pool for `spawn_blocking` (git operations are blocking — libgit2), and `sync`
# gives us `mpsc` channels to send results back to the event loop.
tokio = { version = "1", features = ["rt-multi-thread", "sync"] }
