[package]
name = "type-gpui-demo"
version = "0.1.0"
edition = "2024"
publish = false

# Keep this experiment's dependencies and lockfile out of the production workspace.
[workspace]

[dependencies]
gpui-kit = { version = "=0.7.0", features = ["tree-sitter-markdown", "tree-sitter-markdown-inline"] }

[profile.dev]
debug = 0

[profile.dev.package."*"]
opt-level = 2
